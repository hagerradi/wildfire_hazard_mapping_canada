# Full spatial-only FI baseline using the working Comet workspace.
save_dir: "experiments/fi_spatial_v3_full_mila_lossbest"

modelling_approach: "1"

seed: 42
deterministic: True

model:
  num_classes: 1
  input_feature_list: ["spatial"]

optimizer:
  name: "AdamW"
  lr: 7.0e-4
  loss: "mse"

lr_scheduler:
  name: "cosine_warmup"
  warmup_epochs: 5

training:
  max_epochs: 50
  log_every_n_epoch: 1

evaluation:
  best_ckpt_metrics: ["loss"]
  best_ckpt_metrics_mode: ["min"]
  checkpoint_filename: "best.pth"

data:
  root_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA/data_samples_v3"
  raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"

  train_split: "train_indices.csv"
  val_split: "val_indices.csv"
  test_split: "test_indices.csv"

  batch_size: 64
  num_workers: 2

  valid_mask_threshold: 0.01

  input_sources:
    - name: "grid"
      params:
        feature_names_list: ["ignition_grid", "fuel_grid", "elevation_grid"]
        target_name: "fi"
        out_norm: "min_max"
        fuel_feats_encoding: "one_hot"
        normalize_fuel_feats_ordinal: True
        transforms_list: []
        augmentation_prob: 0.0

logger:
  enabled: True
  project_name: "nrcan05-wildfireriskmapping"
  workspace: "mila"
  experiment_name: "fi_spatial_v3_full_mila_lossbest"
  tags: ["baseline", "full_data", "modelling_approach=1", "target=fi", "spatial_only", "data_samples_v3", "fuel_one_hot_encoding", "best_ckpt=loss"]
  log_every_n_step: 10

metrics: ["mse", "mae", "mae_top01", "mae_top02", "mae_top05", "mae_top10", "spearman", "bias", "ccc", "iou_top005", "iou_top01", "iou_top02", "iou_top05", "iou_top10", "auc_iou_top10", "auc_iou_full"]
