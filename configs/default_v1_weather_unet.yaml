# Where to save checkpoints
save_dir: "experiments/weather_unet_approach_1_full_data"

# approaches 1 or 2
modelling_approach: "1"

seed: 42
deterministic: True

model:
  num_classes: 1
  weather_embed_dim: 64     # Size of the vector fused into the bottleneck
  pooling_type: "max"       # Options: "attention", "mean", "max"

optimizer:
  name: "AdamW"
  lr: 1.0e-3
  loss_name: "mae"

training:
  max_epochs: 50
  log_every_n_epoch: 1

evaluation:
  best_ckpt_metric: "spearman"
  best_ckpt_metric_mode: "max"
  checkpoint_filename: "best.pth"

data:
  root_dir: "/home/mila/o/oseaj/scratch/nrcan_data/data_samples_approach_1_weather"
  raw_data_dir: "/home/mila/o/oseaj/scratch/nrcan_data/"

  train_split: "train_indices.csv"
  val_split: "val_indices.csv"
  test_split: "test_indices.csv"

  transforms_list: []
  augmentation_prob: 0.0

  batch_size: 64
  num_workers: 2

  output_normalization: "min_max"

  feature_names_list: ["ignition_grid", "fuel_grid", "elevation_grid", "weather_grid"]
  fuel_feats_encoding: "ordinal"
  normalize_fuel_feats_ordinal: True
  valid_mask_threshold: 0.00

  # --- Weather Sampling Configuration ---
  weather_table_path: "/home/mila/o/oseaj/scratch/nrcan_data/data_samples_approach_1_weather/weather_table.csv"
  weather_samples_per_item: 128
  weather_channel_name: "weather_grid"
  weather_features: ["temp", "rh", "prec", "ffmc", "dmc", "dc", "isi", "bui"]

logger:
  enabled: True
  project_name: "nrcan-wildfireriskmapping"
  workspace: "mila-amlrt"
  experiment_name: "weather_unet_approach_1_full_data"
  tags: ["weather_fusion", "modelling_approach=1", "mae"]
  log_every_n_step: 5

metrics: ["mse", "mae", "spearman", "ssim", "bias"]
