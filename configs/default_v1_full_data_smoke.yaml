# Short Slurm smoke test for the spatial-only full-data BP baseline.
save_dir: "experiments/smoke_bp_spatial_v3"

modelling_approach: "1"
seed: 42
deterministic: True

model:
  num_classes: 1
  input_feature_list: ["spatial"]

optimizer:
  name: "AdamW"
  lr: 7.0e-4
  loss: "kl"

lr_scheduler:
  name: null
  warmup_epochs: 1

training:
  max_epochs: 1
  log_every_n_epoch: 1

evaluation:
  best_ckpt_metrics: ["ccc"]
  best_ckpt_metrics_mode: ["max"]
  checkpoint_filename: "best.pth"

data:
  root_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA/data_samples_v3"
  raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"

  train_split: "smoke_bp_train_indices_olutayot.csv"
  val_split: "smoke_bp_val_indices_olutayot.csv"
  test_split: "smoke_bp_test_indices_olutayot.csv"

  batch_size: 8
  num_workers: 2
  valid_mask_threshold: 0.01

  input_sources:
    - name: "grid"
      params:
        feature_names_list: ["ignition_grid", "fuel_grid", "elevation_grid"]
        out_norm: "min_max"
        fuel_feats_encoding: "one_hot"
        normalize_fuel_feats_ordinal: True
        transforms_list: []
        augmentation_prob: 0.0

logger:
  enabled: True
  project_name: "nrcan05-wildfireriskmapping"
  workspace: "mila"
  experiment_name: "smoke_bp_spatial_v3"
  tags: ["smoke", "baseline", "full_data", "modelling_approach=1", "target=bp", "spatial_only", "data_samples_v3"]
  log_every_n_step: 1

metrics: ["mse", "mae", "spearman", "bias", "ccc", "kl_div", "iou_top10"]
