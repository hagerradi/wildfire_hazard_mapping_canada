save_dir: experiments/ros_full_config_v3_coordconv_spatialized_weather_fire_size_missing_mask_terrain_fullsupport_bp_channel
modelling_approach: '1'
seed: 42
deterministic: true
model:
  num_classes: 1
  input_branches:
  - spatial
  use_coordconv: true
optimizer:
  name: AdamW
  lr: 0.0007
  loss:
  - huber
  - raw_pearson
  huber_beta: 1.0
  loss_weights:
    huber: 0.7
    raw_pearson: 0.3
lr_scheduler:
  name: cosine_warmup
  warmup_epochs: 5
training:
  max_epochs: 25
  log_every_n_epoch: 1
evaluation:
  best_ckpt_metrics:
  - spearman
  best_ckpt_metrics_mode:
  - max
  checkpoint_filename: best.pth
  prediction_support_policy: input
data:
  root_dir: /network/scratch/o/olutayot/nrcan_wildfireriskmapping/data_samples/data_samples_v3_full_support
  raw_data_dir: /network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA
  train_split: train_indices.csv
  val_split: val_indices.csv
  test_split: test_indices.csv
  batch_size: 32
  num_workers: 2
  valid_mask_threshold: 0.01
  input_sources:
  - name: grid
    params:
      feature_names_list:
      - ignition_grid
      - fuel_grid
      - elevation_grid
      target_name: ros
      out_norm: log_standard
      target_log_mean: 1.759765073915
      target_log_std: 0.532782452748
      fuel_feats_encoding: one_hot
      normalize_fuel_feats_ordinal: true
      transforms_list: []
      augmentation_prob: 0.0
      terrain_derivatives:
      - slope
      - aspect_sin
      - aspect_cos
      terrain_cell_size_m: 100.0
      input_mask_policy: input_only
  - name: bp_prediction
    params:
      prediction_dir: /network/scratch/o/olutayot/projects/nrcan_wildfireriskmapping/experiments/bp_full_config_v3_kl_ccc_hexpairrank_fullsupport_bpzero_restricted_postprocess_all_splits/predicted_hexels
      filename_template: hexel_{hex_id_padded}_predicted.tif
      fill_value: 0.0
      clip_min: 0.0
      clip_max: 1.0
      validate_alignment: true
  - name: spatialized_weather
    params:
      csv_name: weather_table_processed.csv
      feature_names_list:
      - Temperature
      - RelativeHumidity
      - Precipitation
      - FineFuelMoistureCode
      - DuffMoistureCode
      - DroughtCode
      - InitialSpreadIndex
      - BuildupIndex
      - FireWeatherIndex
      - WindSpeed
      - wd_sin
      - wd_cos
      fire_weather_zone_id_col: WeatherZone
      fire_weather_zone_selection_approach: mode
      transforms_list: []
      augmentation_prob: 0.0
      aggregation: mean
      shuffle_lut: false
      shuffle_seed: 42
      include_missing_mask: true
      missing_value_strategy: global_mean
      zone_channel_key: firezones_grid
  - name: spatialized_fire_size
    params:
      csv_name: df_fire_fru_processed.csv
      feature_names_list:
      - NORM_LOG_SIZE_HA
      fire_weather_zone_id_col: GRIDCODE
      fire_weather_zone_selection_approach: mode
      transforms_list: []
      augmentation_prob: 0.0
      aggregation: mean
      shuffle_lut: false
      shuffle_seed: 42
      include_missing_mask: true
      missing_value_strategy: global_mean
      zone_channel_key: firezones_grid
logger:
  enabled: true
  project_name: nrcan05-wildfireriskmapping
  workspace: mila-amlrt
  experiment_name: ros_full_config_v3_coordconv_spatialized_weather_fire_size_missing_mask_terrain_fullsupport_bp_channel
  tags:
  - full_data
  - modelling_approach=1
  - target=ros
  - coordconv=patch_local_multiscale
  - data_samples_v3_full_support
  - fuel_one_hot_encoding
  - best_ckpt=spearman
  - loss=huber_raw_pearson
  - target_norm=log_standard
  - tabular_fusion=spatialized
  - spatialized_sources=weather_fire_size_missing_mask
  - tabular_aggregation=mean
  - shuffle_lut=false
  - missing_mask=true
  - terrain_derivatives=slope_aspect
  - input_mask_policy=input_only
  - prediction_support_policy=input
  - target_loss_mask=finite_ros
  - bp_scalar_channel=postprocessed_fullsupport_bp
  - bp_channel_checkpoint=bp_full_config_v3_kl_ccc_hexpairrank_fullsupport_bpzero/best.pth
  - bp_channel_postprocess=nonfuel_restricted_zero
  - bp_channel_train_predictions=in_sample_pilot
  log_every_n_step: 10
metrics:
- mse
- mae
- normalized_mae
- mae_top01
- mae_top02
- mae_top05
- mae_top10
- spearman
- bias
- ccc
- iou_top005
- iou_top01
- iou_top02
- iou_top05
- iou_top10
- auc_iou_top10
- auc_iou_full
