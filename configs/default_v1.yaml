# Where to save checkpoints
save_dir: "experiments/unet_run_001_approach_1"

# approaches 1 or 2
modelling_approach: "1"

seed: 42
deterministic: True

model:
  num_classes: 1

optimizer:
  name: "AdamW" # "SGD", "Adam", "AdamW"
  lr: 1.0e-3
  loss: "mae" # or ["bce", "kl"], str for single loss or list for multiple weighted losses
  # loss_weights: {"bce": 0.8, "kl": 0.2} # use if loss is a list

training:
  max_epochs: 10
  # Logging frequency in epochs
  log_every_n_epoch: 1

evaluation:
  best_ckpt_metric: "spearman" # loss, ssim, mae, etc
  best_ckpt_metric_mode: "max" # max, or min
  checkpoint_filename: "best.pth" # option to load best or last

data:
  root_dir: "../yan_bp3/data_samples_approach_1"
  raw_data_dir: "../yan_bp3"

  train_split: "train_indices.csv"
  val_split: "val_indices.csv"
  test_split: "test_indices.csv"

  transforms_list: [] # options: "random_flip", "random_rotate"
  augmentation_prob: 0.0 # float between 0 and 1

  batch_size: 64
  num_workers: 2

  output_normalization: "min_max" #log

  feature_names_list: ["ignition_grid", "fuel_grid", "elevation_grid"] # ["ignition_grid", "esc_fires_grid", "fuel_grid", "elevation_grid", "weather_grid", "wind_grid"]
  fuel_feats_encoding: "ordinal" # ordinal, one_hot
  normalize_fuel_feats_ordinal: True
  valid_mask_threshold:  0.00

logger:
  enabled: True
  project_name: "nrcan-wildfireriskmapping"
  workspace: "mila-amlrt"
  experiment_name: "unet_run_001_approach_1"
  tags: ["baseline", "first-exp", "modelling_approach=1", "sigmoid+mae", "3inputfeatures"]
  # log loss and metrics on comet every n steps
  log_every_n_step: 5

metrics: ["mse", "mae", "spearman", "ssim", "bias"]
