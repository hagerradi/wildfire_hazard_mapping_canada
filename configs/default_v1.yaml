# Where to save checkpoints
save_dir: "experiments/unet_run_001_approach_1"

# approaches 1 or 2
modelling_approach: "1"

model:
  input_channels: 3 # if using one hot encoding, we add more 14 more features
  num_classes: 1

optimizer:
  name: "AdamW" # "SGD", "Adam", "AdamW"
  lr: 1.0e-3
  loss_name: "mse" # mse, bce, etc

training:
  max_epochs: 20
  # Logging frequency in epochs
  log_every_n_epoch: 1

data:
  root_dir: "../yan_bp3/data_samples_approach_1"

  train_split: "train_indices.csv"
  val_split: "val_indices.csv"
  test_split: "test_indices.csv"

  batch_size: 64
  num_workers: 2

  output_normalization: "min_max" # options: min_max for approach 2, min_max for approach 1

  feature_names_list: ["ignition_grid", "fuel_grid", "elevation_grid"]
  fuel_feats_encoding: "ordinal" # ordinal, one_hot
  normalize_fuel_feats_ordinal: true

logger:
  project_name: "nrcan-wildfireriskmapping"
  workspace: "mila-amlrt"
  experiment_name: "unet_run_001_approach_1"
  tags: ["baseline", "first-exp", "modelling_approach=1", "sigmoid+mse_loss", "3inputfeatures", "standardized_probs", "masked_metrics"]
  # log loss and metrics on comet every n steps
  log_every_n_step: 5

metrics: ["mse", "mae", "spearman", "ssim"]
