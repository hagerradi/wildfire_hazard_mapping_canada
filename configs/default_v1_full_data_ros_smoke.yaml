# Short Slurm smoke test for the spatial-only full-data ROS log-Huber baseline.
save_dir: "experiments/smoke_ros_spatial_v3_loghuber"

modelling_approach: "1"
seed: 42
deterministic: True

model:
  num_classes: 1
  input_feature_list: ["spatial"]

optimizer:
  name: "AdamW"
  lr: 7.0e-4
  loss: "huber"

lr_scheduler:
  name: null
  warmup_epochs: 1

training:
  max_epochs: 1
  log_every_n_epoch: 1

evaluation:
  best_ckpt_metrics: ["loss"]
  best_ckpt_metrics_mode: ["min"]
  checkpoint_filename: "best.pth"

data:
  root_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA/data_samples_v3"
  raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"

  train_split: "smoke_bp_train_indices_olutayot.csv"
  val_split: "smoke_bp_val_indices_olutayot.csv"
  test_split: "smoke_bp_test_indices_olutayot.csv"

  batch_size: 8
  num_workers: 2
  valid_mask_threshold: 0.01

  input_sources:
    - name: "grid"
      params:
        feature_names_list: ["ignition_grid", "fuel_grid", "elevation_grid"]
        target_name: "ros"
        out_norm: "log_standard"
        target_log_mean: 1.759765073915
        target_log_std: 0.532782452748
        fuel_feats_encoding: "one_hot"
        normalize_fuel_feats_ordinal: True
        transforms_list: []
        augmentation_prob: 0.0

logger:
  enabled: True
  project_name: "nrcan05-wildfireriskmapping"
  workspace: "mila"
  experiment_name: "smoke_ros_spatial_v3_loghuber"
  tags: ["smoke", "baseline", "full_data", "modelling_approach=1", "target=ros", "spatial_only", "data_samples_v3", "fuel_one_hot_encoding", "best_ckpt=loss", "loss=huber", "target_norm=log_standard"]
  log_every_n_step: 1

metrics: ["mse", "mae", "spearman", "bias", "ccc", "iou_top10"]
