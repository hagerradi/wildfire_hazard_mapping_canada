raw_data_dir: "/home/mila/h/hager.radi/scratch/full_data_bp3plus/canada_bp3+_2026_MILA"
save_dir: "experiments/counterfactual_fuel_multi_output_hex16"
hex_ids: ["16"]

# Single multi-output checkpoint jointly predicting bp/fi(/ros) instead of three
# separate single-target models. All three endpoint names still point at the exact
# same config_path, so `evaluate_counterfactual.py` runs inference for this checkpoint
# only once per scenario and the existing per-target plotting scripts (`--endpoint bp`,
# `--endpoint fi`, `--endpoint ros`) keep working unchanged, reading each target's
# raster from its suffixed filename (`hexel_XX_<target>_predicted.tif`) inside the
# shared prediction directory.
endpoints:
  bp:
    config_path: "configs/hazard_eval_multi_output_spatial_weather_checkpoint.yaml"
  fi:
    config_path: "configs/hazard_eval_multi_output_spatial_weather_checkpoint.yaml"
  ros:
    config_path: "configs/hazard_eval_multi_output_spatial_weather_checkpoint.yaml"

scenarios:
  - name: "baseline"
    kind: "baseline"
    description: "Unmodified prepared fuel inputs."

  - name: "remove_barriers_adjacent_modal"
    kind: "fuel"
    description: "Replace each connected non-fuel component with its modal adjacent burnable fuel group."
    params:
      mode: "nonfuel_to_burnable_local_adjacent_modal"
      nonfuel_ids: [100, 101, 102, 105, 106, 110]

  - name: "remove_barriers_fixed_c2"
    kind: "fuel"
    description: "Replace every non-fuel barrier pixel with C-2 boreal spruce."
    params:
      mode: "nonfuel_to_burnable_fixed"
      nonfuel_ids: [100, 101, 102, 105, 106, 110]
      replacement_fuel_id: 2

  - name: "insert_random_nonfuel_10pct"
    kind: "fuel"
    description: "Replace area-weighted random same-fuel components covering approximately 10% of burnable area."
    params:
      mode: "burnable_components_to_nonfuel_random"
      nonfuel_ids: [100, 101, 102, 105, 106, 110]
      replacement_nonfuel_id: 101
      target_burnable_area_fraction: 0.10
      seed: 42

  - name: "c2_to_mixedwood_fixed"
    kind: "fuel"
    description: "Replace every C-2 boreal spruce pixel with a fixed Boreal Mixedwood (M-1/M-2) fuel type."
    params:
      mode: "burnable_to_burnable_fixed"
      nonfuel_ids: [100, 101, 102, 105, 106, 110]
      source_fuel_ids: [2]
      replacement_fuel_id: 620
