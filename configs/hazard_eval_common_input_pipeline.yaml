# Hazard evaluation (BP x FI) over the common-input-pipeline checkpoints.
# Loads the BP and FI models from their training configs + checkpoints, then combines
# their predictions into a scaled hazard product. No hazard math is defined here; this
# config only declares inputs, computation settings, and artifact toggles.
save_dir: "experiments/hazard_eval_common_input_pipeline"

# Shared data root/raw/test split match the BP/FI common input pipeline configs.
root_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA/data_samples_v3"
raw_data_dir: "/network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA"
test_split: "test_indices.csv"
valid_mask_threshold: 0.01
mask_scope: "actual" # actual | buffer | buffer_only
stitch_mode: "mean" # mean | max

bp:
  config_path: "configs/archived/bp_common_input_pipeline_checkpoint.yaml"
  checkpoint_filename: "best.pth"
  save_predictions: false

fi:
  config_path: "configs/archived/fi_common_input_pipeline_checkpoint.yaml"
  checkpoint_filename: "best.pth"
  save_predictions: false

# Hazard computation
fi_cap: 10000.0 # null => uncapped
scale_to: 100.0
bin_thresholds: [0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 25.0, 50.0]
scale_denominator: null # explicit numeric denominator; null => derive from source
scale_denominator_source: "all_raw_ground_truth" # reference_file | all_raw_ground_truth | train_ground_truth | eval_ground_truth | prediction
reference_denominator_path: null # required when source is reference_file and no numeric denominator is set
on_missing_reference_denominator: "error" # error
self_normalized_prediction: false

# Artifacts
metrics: ["spearman", "auc_iou_full"]
save_hazard_map: true
