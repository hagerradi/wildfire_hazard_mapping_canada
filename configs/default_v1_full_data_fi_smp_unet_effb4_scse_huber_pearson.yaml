save_dir: experiments/fi_full_config_v3_smp_unet_effb4_scse_huber_pearson
modelling_approach: "1"
seed: 42
deterministic: true

model:
  architecture: smp
  smp_architecture: Unet
  smp_encoder_name: efficientnet-b4
  smp_encoder_weights: imagenet
  smp_kwargs:
    decoder_attention_type: scse
  num_classes: 1
  input_feature_list:
    - spatial
    - auxiliary
  use_coordconv: true
  auxiliary_feature_encoder_poolings:
    weather: max
    fire_size: max

optimizer:
  name: AdamW
  lr: 0.0003
  loss:
    - huber
    - raw_pearson
  huber_beta: 1.0
  loss_weights:
    huber: 0.7
    raw_pearson: 0.3

lr_scheduler:
  name: cosine_warmup
  warmup_epochs: 5

training:
  max_epochs: 25
  log_every_n_epoch: 1

evaluation:
  best_ckpt_metrics:
    - spearman
  best_ckpt_metrics_mode:
    - max
  checkpoint_filename: best.pth

data:
  root_dir: /network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA/data_samples_v3
  raw_data_dir: /network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA
  train_split: train_indices.csv
  val_split: val_indices.csv
  test_split: test_indices.csv
  batch_size: 16
  num_workers: 2
  valid_mask_threshold: 0.01
  input_sources:
    - name: grid
      params:
        feature_names_list:
          - ignition_grid
          - fuel_grid
          - elevation_grid
        target_name: fi
        out_norm: log_standard
        target_log_mean: 7.923288536666
        target_log_std: 1.127596617984
        fuel_feats_encoding: one_hot
        normalize_fuel_feats_ordinal: true
        transforms_list: []
        augmentation_prob: 0.0
    - name: weather
      params:
        csv_name: weather_table_processed.csv
        feature_names_list:
          - Temperature
          - RelativeHumidity
          - Precipitation
          - FineFuelMoistureCode
          - DuffMoistureCode
          - DroughtCode
          - InitialSpreadIndex
          - BuildupIndex
          - FireWeatherIndex
          - WindSpeed
          - wd_sin
          - wd_cos
        fire_weather_zone_id_col: WeatherZone
        fire_weather_zone_selection_approach: mode
        num_samples_per_patch: 256
        sampling_bias: null
        feature_to_bias: null
        transforms_list: []
        augmentation_prob: 0.0
    - name: fire_size
      params:
        csv_name: df_fire_fru_processed.csv
        feature_names_list:
          - NORM_LOG_SIZE_HA
        fire_weather_zone_id_col: GRIDCODE
        fire_weather_zone_selection_approach: mode
        num_samples_per_patch: 128
        sampling_bias: high_values
        feature_to_bias: NORM_LOG_SIZE_HA
        transforms_list: []
        augmentation_prob: 0.0

logger:
  enabled: true
  project_name: nrcan05-wildfireriskmapping
  workspace: mila-amlrt
  experiment_name: fi_full_config_v3_smp_unet_effb4_scse_huber_pearson
  tags:
    - full_data
    - modelling_approach=1
    - target=fi
    - spatial_weather_fire_size
    - architecture=smp_unet
    - encoder=efficientnet-b4
    - pretrained=imagenet
    - decoder_attention=scse
    - aux_as_channels
    - coordconv=patch_local_input
    - data_samples_v3
    - fuel_one_hot_encoding
    - best_ckpt=spearman
    - loss=huber_raw_pearson
    - target_norm=log_standard
  log_every_n_step: 10

metrics:
  - mse
  - mae
  - normalized_mae
  - mae_top01
  - mae_top02
  - mae_top05
  - mae_top10
  - spearman
  - bias
  - ccc
  - iou_top005
  - iou_top01
  - iou_top02
  - iou_top05
  - iou_top10
  - auc_iou_top10
  - auc_iou_full
