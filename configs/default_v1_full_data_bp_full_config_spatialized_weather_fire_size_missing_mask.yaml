save_dir: experiments/bp_full_config_v3_spatialized_weather_fire_size_missing_mask
modelling_approach: '1'
seed: 42
deterministic: true
model:
  num_classes: 1
  input_branches:
  - spatial
optimizer:
  name: AdamW
  lr: 0.0007
  loss: kl
lr_scheduler:
  name: cosine_warmup
  warmup_epochs: 5
training:
  max_epochs: 25
  log_every_n_epoch: 1
evaluation:
  best_ckpt_metrics:
  - ccc
  best_ckpt_metrics_mode:
  - max
  checkpoint_filename: best.pth
data:
  root_dir: /network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA/data_samples_v3
  raw_data_dir: /network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA
  train_split: train_indices.csv
  val_split: val_indices.csv
  test_split: test_indices.csv
  batch_size: 64
  num_workers: 2
  valid_mask_threshold: 0.01
  input_sources:
  - name: grid
    params:
      feature_names_list:
      - ignition_grid
      - fuel_grid
      - elevation_grid
      target_name: bp
      out_norm: min_max
      fuel_feats_encoding: one_hot
      normalize_fuel_feats_ordinal: true
      transforms_list: []
      augmentation_prob: 0.0
  - name: spatialized_weather
    params:
      csv_name: weather_table_processed.csv
      feature_names_list:
      - Temperature
      - RelativeHumidity
      - Precipitation
      - FineFuelMoistureCode
      - DuffMoistureCode
      - DroughtCode
      - InitialSpreadIndex
      - BuildupIndex
      - FireWeatherIndex
      - WindSpeed
      - wd_sin
      - wd_cos
      fire_weather_zone_id_col: WeatherZone
      fire_weather_zone_selection_approach: mode
      transforms_list: []
      augmentation_prob: 0.0
      aggregation: mean
      shuffle_lut: false
      shuffle_seed: 42
      include_missing_mask: true
      missing_value_strategy: global_mean
      zone_channel_key: firezones_grid
  - name: spatialized_fire_size
    params:
      csv_name: df_fire_fru_processed.csv
      feature_names_list:
      - NORM_LOG_SIZE_HA
      fire_weather_zone_id_col: GRIDCODE
      fire_weather_zone_selection_approach: mode
      transforms_list: []
      augmentation_prob: 0.0
      aggregation: mean
      shuffle_lut: false
      shuffle_seed: 42
      include_missing_mask: true
      missing_value_strategy: global_mean
      zone_channel_key: firezones_grid
logger:
  enabled: true
  project_name: nrcan05-wildfireriskmapping
  workspace: mila-amlrt
  experiment_name: bp_full_config_v3_spatialized_weather_fire_size_missing_mask
  tags:
  - full_data
  - modelling_approach=1
  - target=bp
  - data_samples_v3
  - fuel_one_hot_encoding
  - loss=kl
  - tabular_fusion=spatialized
  - spatialized_sources=weather_fire_size_missing_mask
  - tabular_aggregation=mean
  - shuffle_lut=false
  - missing_mask=true
  log_every_n_step: 10
metrics:
- mse
- mae
- normalized_mae
- mae_top01
- mae_top02
- mae_top05
- mae_top10
- spearman
- bias
- ccc
- kl_div
- iou_top005
- iou_top01
- iou_top02
- iou_top05
- iou_top10
- auc_iou_top10
- auc_iou_full
