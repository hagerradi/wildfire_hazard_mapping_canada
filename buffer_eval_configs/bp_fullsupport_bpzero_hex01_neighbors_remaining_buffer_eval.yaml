save_dir: experiments/bp_full_config_v3_kl_ccc_hexpairrank_fullsupport_bpzero_hex01_neighbors
modelling_approach: '1'
seed: 42
deterministic: true
model:
  num_classes: 1
  input_branches:
  - spatial
  - auxiliary
  auxiliary_hidden_dims:
    tabular_weather:
    - 32
    - 64
    - 128
    tabular_fire_size:
    - 8
    - 16
  auxiliary_embed_dims:
    tabular_weather: 128
    tabular_fire_size: 16
  auxiliary_feature_encoder_poolings:
    tabular_weather: max
    tabular_fire_size: max
optimizer:
  name: AdamW
  lr: 0.0007
  loss:
  - kl
  - ccc
  - hex_mean_pairwise_rank
  - hex_top10_pairwise_rank
  loss_weights:
    kl: 0.45
    ccc: 0.45
    hex_mean_pairwise_rank: 0.05
    hex_top10_pairwise_rank: 0.05
lr_scheduler:
  name: cosine_warmup
  warmup_epochs: 5
training:
  max_epochs: 25
  log_every_n_epoch: 1
evaluation:
  best_ckpt_metrics:
  - ccc
  best_ckpt_metrics_mode:
  - max
  checkpoint_filename: best.pth
  bp_nodata_as_zero: true
  prediction_support_policy: input
data:
  root_dir: /network/scratch/o/olutayot/nrcan_wildfireriskmapping/data_samples/data_samples_v3_buffer_hex01_neighbors_full_support
  raw_data_dir: /network/projects/amlrt/nrcan_wildfires/data/full_data_bp3plus/canada_bp3+_2026_MILA
  train_split: train_indices.csv
  val_split: val_indices.csv
  test_split: test_indices_hex34_hex38.csv
  batch_size: 8
  num_workers: 2
  valid_mask_threshold: 0.01
  include_patch_metadata: true
  input_sources:
  - name: grid
    params:
      feature_names_list:
      - ignition_grid
      - fuel_grid
      - elevation_grid
      target_name: bp
      out_norm: min_max
      fuel_feats_encoding: one_hot
      normalize_fuel_feats_ordinal: true
      transforms_list: []
      augmentation_prob: 0.0
      bp_nodata_as_zero: true
      input_mask_policy: input_only
  - name: weather
    params:
      csv_name: weather_table_processed.csv
      feature_names_list:
      - Temperature
      - RelativeHumidity
      - Precipitation
      - FineFuelMoistureCode
      - DuffMoistureCode
      - DroughtCode
      - InitialSpreadIndex
      - BuildupIndex
      - FireWeatherIndex
      - WindSpeed
      - wd_sin
      - wd_cos
      fire_weather_zone_id_col: WeatherZone
      fire_weather_zone_selection_approach: mode
      num_samples_per_patch: 256
      sampling_bias: null
      feature_to_bias: null
      transforms_list: []
      augmentation_prob: 0.0
  - name: fire_size
    params:
      csv_name: df_fire_fru_processed.csv
      feature_names_list:
      - NORM_LOG_SIZE_HA
      fire_weather_zone_id_col: GRIDCODE
      fire_weather_zone_selection_approach: mode
      num_samples_per_patch: 128
      sampling_bias: high_values
      feature_to_bias: NORM_LOG_SIZE_HA
      transforms_list: []
      augmentation_prob: 0.0
logger:
  enabled: false
  project_name: nrcan05-wildfireriskmapping
  workspace: mila-amlrt
  experiment_name: bp_fullsupport_hex01_neighbors_buffer_eval
  tags:
  - full_data
  - modelling_approach=1
  - target=bp
  - deployment_buffer_eval
  - input_mask_policy=input_only
  - bp_nodata_as_zero=true
  - hex01_neighbor_overlap
  - anchor=hex01
  - neighbors=05_08_29_33_34_38
  log_every_n_step: 10
metrics:
- mse
- mae
- normalized_mae
- mae_top01
- mae_top02
- mae_top05
- mae_top10
- spearman
- bias
- ccc
- kl_div
- iou_top005
- iou_top01
- iou_top02
- iou_top05
- iou_top10
- auc_iou_top10
- auc_iou_full
data_prep:
  modelling_approach: 1
  win_h: 256
  win_w: 256
  overlap_ratio: 0.2
